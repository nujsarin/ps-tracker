.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}

/* ---------------- monthly close / history / archive ---------------- */
function curMonth() { return monthOf(todayISO()); }
function addMonths(ym, n) { var p = ym.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthEnd(ym) { return ym + '-' + pad(daysInMonth(ym)); }
function monthRec(ym) { return Store.months.find(function (m) { return m.month === ym && !m.deleted; }); }
function isClosed(ym) { var m = monthRec(ym); return !!(m && m.closed); }
function isLockedDate(iso) { return !!iso && isClosed(monthOf(iso)); }
function exportedAfterClose(rec) { return !!rec && !!rec.closedAt && ((Store.state.lastExport || '') >= rec.closedAt || (rec.exportedAt || '') >= rec.closedAt); }
function canClose(ym) { return monthEnd(ym) <= todayISO(); }
function statusAt(p, iso) {
  if ((p.recordDate || '') > iso) return null;
  var st = null;
  liveFollows().filter(function (f) { return f.projectId === p.id && f.date <= iso; }).sort(function (a, b) { return (a.date + a.createdAt).localeCompare(b.date + b.createdAt); }).forEach(function (f) { st = f.statusAfter; });
  if (liveSales().some(function (s) { return s.projectId === p.id && validSale(s) && s.soDate && s.soDate <= iso; })) st = ST.WON;
  return st || ST.NEW;
}
function snapshotItems(ym) {
  var end = monthEnd(ym);
  return liveProjects().map(function (p) {
    var st = statusAt(p, end); if (!st) return null;
    return { projectId: p.id, code: p.code, name: p.name, ptype: p.ptype, channel: p.channel || '', province: p.province, contactRole: p.contactRole, pform: p.pform || '', site: p.site || '', status: st, estimate: p.estimate || 0, closingDate: p.closingDate || '', completion: p.completion || '' };
  }).filter(Boolean);
}
function statsFor(ym, items) {
  var from = ym + '-01', end = monthEnd(ym);
  var F = liveFollows().filter(function (f) { return f.date >= from && f.date <= end; });
  var SO = liveSales().filter(function (s) { return validSale(s) && s.soDate >= from && s.soDate <= end; });
  var funnel = {}; STATUSES.forEach(function (s) { funnel[s] = 0; }); items.forEach(function (i) { funnel[i.status] = (funnel[i.status] || 0) + 1; });
  var ch = {}; liveProjects().forEach(function (p) { if (p.recordDate >= from && p.recordDate <= end) { var k = p.channel || 'ไม่ระบุ'; ch[k] = (ch[k] || 0) + 1; } });
  var tg = targetFor(ym);
  return { month: ym, newProjects: liveProjects().filter(function (p) { return p.recordDate >= from && p.recordDate <= end; }).length, follows: F.length, channels: ch,
    soCount: SO.length, soSum: SO.reduce(function (a, s) { return a + (s.soValue || 0); }, 0), dpSum: SO.reduce(function (a, s) { return a + (s.dp || 0); }, 0), target: tg ? tg.amount : null, funnel: funnel, projects: items.length };
}
function monthStats(ym) {
  var rec = monthRec(ym);
  if (rec && rec.archived && rec.totals) return rec.totals;
  var st = statsFor(ym, rec && rec.closed ? rec.items : snapshotItems(ym));
  if (rec && rec.closed && rec.totals && rec.totals.dpSum != null) st.dpSum = rec.totals.dpSum;

}
function dataMonths() {
  var ms = [];
  liveProjects().forEach(function (p) { ms.push(monthOf(p.recordDate)); });
  liveFollows().forEach(function (f) { ms.push(monthOf(f.date)); });
  liveSales().forEach(function (s) { ms.push(monthOf(s.soDate)); });
  Store.months.forEach(function (m) { if (!m.deleted) ms.push(m.month); });
  ms = ms.filter(function (m) { return /^\d{4}-\d{2}$/.test(m); }).sort();
  var start = ms[0] || curMonth(), out = [], m = start, cur = curMonth();
  while (m <= cur && out.length < 120) { out.push(m); m = addMonths(m, 1); }
  return out.reverse();
}
function monthHasData(ym) { var from = ym + '-01', end = monthEnd(ym); return liveFollows().some(function (f) { return f.date >= from && f.date <= end; }) || liveSales().some(function (s) { return s.soDate >= from && s.soDate <= end; }); }
function closeMonth(ym) {

  var rec = monthRec(ym) || stamp({ id: uid(), kind: 'month', month: ym, createdAt: nowISO() });
  rec.closed = true; rec.closedAt = nowISO(); rec.items = items; rec.totals = statsFor(ym, items);

function reopenMonth(ym) { var rec = monthRec(ym); rec.closed = false; rec.reopenedAt = nowISO(); return Store.save(rec); }

  var ps = Store.projects.filter(function (p) {
    if (!p.deleted && ACTIVE.indexOf(p.status) >= 0) return false;

function archiveMonth(ym, pw) {

    var payload = { records: a.projects.concat(a.follows, a.sales, a.quotes), photos: ph.filter(Boolean).map(function (x) { return { id: x.id, mime: x.mime, b64: b64(x.bytes) }; }), state: { archiveOf: ym } };

    return Cx.derive(pw, salt, KDF_ITER).then(function (k) { return Cx.encJSON(k, payload); }).then(function (e) {
      download(new Blob([JSON.stringify({ format: 'ps-tracker-backup', version: 1, kind: 'archive', month: ym, appVersion: APP_VERSION, schema: SCHEMA_VERSION, createdAt: nowISO(), empId: P().empId, kdf: { salt: b64(salt), iter: KDF_ITER }, iv: b64(e.iv), ct: b64(e.ct) })], { type: 'application/json' }), name);
    });
  }).then(function () {
    var keep = {}; Store.projects.forEach(function (x) { if (a.projects.indexOf(x) < 0) (x.photos || []).forEach(function (ph) { keep[ph] = 1; }); }); photoIds = photoIds.filter(function (ph) { return !keep[ph]; });
    var jobs = a.projects.concat(a.follows, a.sales, a.quotes).map(function (r) { return Store.purge(r); }).concat(photoIds.map(function (id) { return Store.delPhoto(id); }));
    return Promise.all(jobs);
  }).then(function () {
    rec.archived = true; rec.archivedAt = nowISO(); rec.archiveFile = name; rec.archivedCount = a.projects.length; rec.totals = totals;
    return Store.save(rec);
  }).then(function () { return a.projects.length; });
}

    return DIR.put(nu);
  }).then(function () {
    S.users = (S.users || []).concat([nu]); S.user = nu; S.newUser = false;
    S.hasAuth = true; S.draft = null; S.ui = {};
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    location.hash = '#/today'; render(); toast('ตั้งค่าเรียบร้อย เริ่มใช้งานได้เลย');
  }).catch(function () { toast('ตั้งค่าไม่สำเร็จ'); btn.disabled = false; btn.textContent = 'เริ่มใช้งาน'; });
}
var LOCK_STEPS = [30000, 60000, 300000, 900000];
function lockWaitText() { var sec = Math.max(1, Math.ceil((S.lockUntil - Date.now()) / 1000)); return 'ใส่ PIN ผิดหลายครั้ง กรุณารอ ' + (sec > 90 ? Math.ceil(sec / 60) + ' นาที' : sec + ' วินาที'); }
function tryUnlock() {
  if (S.lockUntil > Date.now()) return;
  var pin = $('#pin').value, msg = $('#lockmsg'), btn = $('[data-act="unlock"]');
  if (!/^\d{6}$/.test(pin)) { msg.textContent = 'PIN ต้องเป็นตัวเลข 6 หลัก'; return; }
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
  var lk = { n: 0, until: 0 };
  DB.get('meta', 'lock').then(function (l) { if (l) lk = l; if (lk.until > Date.now()) { S.lockUntil = lk.until; throw 'locked'; } return DB.get('meta', 'auth'); }).then(function (a) {
    return Cx.derive(pin, a.salt, a.iter).then(function (k) { return Cx.decJSON(k, a.iv, a.ct).then(function () { return k; }); });
  }).then(function (k) {
    Cx.key = k; S.failed = 0; S.lockUntil = 0; return DB.put('meta', { n: 0, until: 0 }, 'lock').catch(function () { }).then(function () { return Store.load(); });
  }).then(syncUserEntry).then(function () { touch(); S.route = ''; if (!location.hash || location.hash === '#') location.hash = '#/today'; render(); if (S.call && Date.now() - S.call.at < 7200000) setTimeout(openCall, 400); else S.call = null; }).catch(function (e) {
    if (e === 'locked') { render(); return; }
    Cx.key = null; Store.reset(); lk.n = (lk.n || 0) + 1;
    if (lk.n >= 5) { var dl = LOCK_STEPS[Math.min(LOCK_STEPS.length - 1, lk.n - 5)]; lk.until = Date.now() + dl; S.lockUntil = lk.until; setTimeout(render, dl + 500); }
    DB.put('meta', lk, 'lock').catch(function () { }).then(function () { render(); var m = $('#lockmsg'); if (m && S.lockUntil <= Date.now()) m.textContent = 'PIN ไม่ถูกต้อง' + (lk.n >= 3 ? ' (ผิด ' + lk.n + ' ครั้ง)' : ''); });
  });
}
function lockApp() { Cx.key = null; Store.reset(); S.draft = null; S.ui = {}; S.route = ''; S.sidx = null; $('#modal').innerHTML = ''; render(); }
function changePin(a, b) {
  if (!/^\d{6}$/.test(a)) { toast('PIN ต้องเป็นตัวเลข 6 หลัก'); return; }
  if (a !== b) { toast('PIN ทั้งสองช่องไม่ตรงกัน'); return; }
  toast('กำลังเปลี่ยน PIN…');
  var salt = crypto.getRandomValues(new Uint8Array(16)), oldKey = Cx.key, newKey;
  Cx.derive(a, salt, KDF_ITER).then(function (k) {
    newKey = k;
    return DB.all('photos').then(function (ps) { return Promise.all(ps.map(function (p) { return Cx.dec(oldKey, p.iv, p.ct).then(function (b) { return Cx.enc(newKey, b); }).then(function (e) { p.iv = e.iv; p.ct = e.ct; return p; }); })); });
  }).then(function (photos) {
    Cx.key = newKey;
    var all = Store.all();
    return Promise.all(all.map(function (r) { return Cx.encJSON(newKey, r).then(function (e) { return { id: r.id, kind: r.kind, iv: e.iv, ct: e.ct }; }); })).then(function (recs) {
      return Promise.all([Cx.encJSON(newKey, { ok: 'ps-tracker' }), Cx.encJSON(newKey, Store.state)]).then(function (v) {
        return new Promise(function (res, rej) {
          var t = DB.db.transaction(['meta', 'records', 'photos'], 'readwrite');
          recs.forEach(function (r) { t.objectStore('records').put(r); });
          photos.forEach(function (p) { t.objectStore('photos').put(p); });
          t.objectStore('meta').put({ salt: salt, iter: KDF_ITER, iv: v[0].iv, ct: v[0].ct, createdAt: nowISO() }, 'auth');
          t.objectStore('meta').put({ iv: v[1].iv, ct: v[1].ct }, 'vault');
          t.oncomplete = res; t.onerror = function () { rej(t.error); }; t.onabort = function () { rej(t.error); };
        });
      });
    });
  }).then(function () { toast('เปลี่ยน PIN แล้ว'); rerender(); }).catch(function () { Cx.key = oldKey; toast('เปลี่ยน PIN ไม่สำเร็จ ใช้ PIN เดิมต่อได้'); });
}

/* ---------------- auto-lock ---------------- */
setInterval(function () { if (Cx.key && Date.now() - S.lastActive > (Store.state ? Store.state.settings.autolock : 5) * 60000) lockApp(); }, 15000);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { S.hiddenAt = Date.now(); if (S.call) S.callHidden = true; }
  else if (Cx.key && S.hiddenAt && Date.now() - S.hiddenAt > (Store.state ? Store.state.settings.autolock : 5) * 60000) lockApp();
  else if (Cx.key && S.call && S.callHidden && Date.now() - S.call.at < 7200000) setTimeout(openCall, 400);
});

/* ---------------- boot ---------------- */
if (!window.crypto || !crypto.subtle || !window.indexedDB) {
  app.innerHTML = '<div class="lock"><h1>เบราว์เซอร์นี้ไม่รองรับ</h1><p>กรุณาเปิดผ่าน Safari หรือ Chrome รุ่นล่าสุด และเปิดผ่านลิงก์ https เท่านั้น</p></div>';
  return;
}
DIR.open().then(function () { return DIR.all(); }).then(function (users) {
  S.users = users || [];
  if (S.users.length) return;
  DB_NAME = 'ps-tracker';
  return DB.open().then(function () { return DB.get('meta', 'auth'); }).then(function (a) {
    if (!a) return;
    var legacy = { id: 'u0', db: 'ps-tracker', empId: '', label: 'ผู้ใช้เดิม', createdAt: nowISO() };
    return DIR.put(legacy).then(function () { S.users = [legacy]; });
  });
}).then(function () {
  if (S.users.length === 1) return selectUser(S.users[0]);
  render();
}).catch(function () {
  app.innerHTML = '<div class="lock"><h1>เปิดฐานข้อมูลไม่ได้</h1><p>หากใช้โหมดไม่ระบุตัวตน (Private) ให้ปิดโหมดนั้นก่อน หรือปิดแท็บอื่นของแอปนี้แล้วลองใหม่</p></div>';
});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); }).catch(function () { });
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController) { S.updateReady = true; if (Cx.key) rerender(); } });
}

window.__PST = { version: APP_VERSION };
})();
</script>
