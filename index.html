<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Project Sales Tracker</title>

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --accent:#ffbf0f; --accent-2:#fdcd72; --accent-soft:#fff5d6;
  --text:#535353; --text-strong:#3a3a3a; --muted:#6b6b6b;
  --bg:#fbfbfb; --surface:#ffffff; --line:#ececec; --line-2:#d6d6d6;
  --ok:#008000; --ok-text:#006400; --ok-soft:#e6f2e6;
  --danger:#FF0000; --danger-text:#D00000; --info:#0000FF; --info-soft:#e8e8ff;
  --radius:12px; --nav-h:72px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--text-strong)}
h1,h2,h3{margin:0;color:var(--text-strong)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:4px;min-height:60px}
.topbar h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar.yellow{background:var(--accent);border-bottom:0}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-strong);cursor:pointer;text-decoration:none;flex-shrink:0}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0000FF;outline-offset:2px}
.main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.main.noNav{padding-bottom:120px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card.warn{background:var(--accent-soft);border-color:var(--accent-2)}
.card.alert{border:1.5px solid var(--danger)}
.card.okc{background:var(--ok-soft);border-color:transparent}
.card.link{display:block;text-decoration:none;color:inherit}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--text-strong)}
.stat span{font-size:13px}
button.stat{font:inherit;color:inherit;cursor:pointer;width:100%;min-height:72px}
button.stat[aria-pressed="true"]{border:2px solid var(--accent);background:#fff8e0}
#tlist{scroll-margin-top:72px}
.cgrps{display:flex;flex-wrap:wrap;gap:8px}
.cgrp{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border:1px dashed #cfcfcf;border-radius:28px}
.cgrp.on{border:1.5px solid var(--accent);background:#fffaf0}
.secnav{display:flex;flex-wrap:wrap;gap:6px}
.secnav button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:inherit;font-size:13px;color:var(--text-strong);cursor:pointer}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:72px}
.sec>h2{margin:6px 0 0;padding-bottom:6px;border-bottom:2px solid var(--accent);font-size:17px;color:var(--text-strong)}
.progress.over>div{background:var(--ok)}
.hero2{background:var(--accent);margin:-16px -16px 0;padding:6px 20px 68px;color:#3a3a3a}
.hero2 h2{font-size:24px;color:#2b2b2b;margin:2px 0 0}
.herocard{margin-top:-56px;box-shadow:0 6px 18px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px;padding:16px}
a.stat{display:block;text-decoration:none;color:inherit}
.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.menu a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text-strong);font-size:13px;text-align:center;line-height:1.25;min-height:84px}
.menu a .mi{width:56px;height:56px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#2b2b2b;position:relative}
.menu a .mi .nb{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger-text);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills a{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:var(--text-strong);font-weight:600}
.pills a i{width:36px;height:36px;border-radius:10px;background:#fff3cf;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-style:normal}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);font-size:14px;white-space:nowrap}
.tabs a b{font-size:12px;min-width:22px;height:22px;border-radius:11px;background:#f0f0f0;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;color:var(--text-strong)}
.tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#2b2b2b;font-weight:700}
.tabs a[aria-current="page"] b{background:#fff}
.tabs a.red b{background:var(--danger-text);color:#fff}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 8px}
.empty h2{font-size:22px;color:var(--text-strong);margin:4px 0 0}
.lhead{font-size:14px;color:var(--text);font-weight:600;margin:16px 4px 6px}
.lgroup{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px;text-decoration:none;color:var(--text-strong);border:0;border-top:1px solid #f0f0f0;width:100%;background:none;font:inherit;text-align:left;cursor:pointer}
.lgroup>.lrow:first-child{border-top:0}
.lrow .li{width:36px;height:36px;border-radius:10px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#3a3a3a}
.lrow .lt{flex:1;min-width:0;font-size:16px;display:flex;flex-direction:column}
.lrow .lt small{font-size:13px;color:var(--text);font-weight:400}
.lrow .lv{color:var(--text);font-size:14px;text-align:right;max-width:45%}
.lrow.hl{background:#fffaf0}
.lrow.hl .li{background:var(--accent)}
.lrow.warnrow .li{background:#fff3cf;color:#8a6d00}
.lrow.danger{color:var(--danger-text)}
.lrow.danger .li{background:#ffecec;color:var(--danger-text)}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0 4px;color:var(--text)}
@media (min-width:900px){.hero2{margin:0;border-radius:16px;padding:16px 24px 72px}.menu{grid-template-columns:repeat(8,minmax(0,1fr))}}
.foot i{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#2b2b2b}
a.card.between{display:flex;gap:12px;align-items:center}
.h2{font-size:17px;font-weight:700;color:var(--text-strong);margin:8px 0 0}
.small{font-size:13px}
.strong{color:var(--text-strong);font-weight:700}
.muted{color:var(--muted)}
.dangerText{color:var(--danger-text)}
.okText{color:var(--ok-text)}
.btn{min-height:48px;border-radius:12px;border:1.5px solid var(--text);background:var(--surface);color:var(--text-strong);font-weight:600;font-size:16px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
.btn.block{width:100%}
.btn.danger{border-color:var(--danger);color:var(--danger-text)}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.btn[disabled]{background:#e2e2e2;border-color:#e2e2e2;color:#6b6b6b;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl,legend.lbl{font-size:15px;font-weight:700;color:var(--text-strong)}
.req{color:var(--danger)}
.inp{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--surface);font-size:16px;color:var(--text-strong)}
textarea.inp{min-height:84px;resize:vertical}
.inp.big{font-size:22px;font-weight:700;text-align:right}
.inp.err{border:1.5px solid var(--danger)}
.errmsg{font-size:13px;color:var(--danger-text);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--text-strong);font-weight:700}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-new{background:var(--info-soft);color:var(--info)}
.b-mid{background:var(--accent-2);color:var(--text-strong)}
.b-nego{background:var(--accent);color:var(--text-strong)}
.b-won{background:var(--ok-soft);color:var(--ok-text)}
.b-lost{background:#f1f1f1;color:var(--text)}
.b-hold{background:#fff;color:var(--text);border:1px dashed #9e9e9e}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps span.bar{display:block;height:6px;border-radius:3px;background:#e2e2e2}
.steps .on span.bar{background:var(--accent)}
.steps small{font-size:13px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.pipe span{display:block;height:6px;border-radius:3px;background:#e2e2e2}
.pipe .done span{background:var(--text)}
.pipe .cur span{background:var(--accent)}
.pipe small{font-size:12px}
.barrow{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:14px}
.bartrack{height:14px;border-radius:7px;background:#f1f1f1;position:relative;overflow:visible}
.barfill{height:100%;border-radius:7px;background:var(--text)}
.progress{position:relative;height:14px;border-radius:7px;background:#eee}
.progress>div{height:100%;border-radius:7px;background:var(--accent)}
.progress>i{position:absolute;top:-4px;width:2px;height:22px;background:var(--text-strong)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px}
.tl .dot{display:flex;flex-direction:column;align-items:center}
.tl .dot i{width:12px;height:12px;border-radius:6px;background:var(--text);margin-top:5px}
.tl .dot b{flex:1;width:2px;background:#e2e2e2}
.tl .body{padding-bottom:16px;display:flex;flex-direction:column;gap:2px}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photo{position:relative;height:130px;border-radius:12px;border:1.5px dashed #9e9e9e;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;font-size:14px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo .rm{position:absolute;top:6px;right:6px;z-index:2;min-height:32px;min-width:32px;border-radius:16px;border:0;background:#fff;font-weight:700;cursor:pointer}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:-16px -16px 0}
.hero div{height:150px;background:#d9d4c7;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:grid;background:#f1f1f1;border-radius:10px;padding:3px}
.seg button{min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;font-size:15px}
.segl{min-height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);font-size:15px}
.segl[aria-current="page"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700;color:var(--text-strong)}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700;color:var(--text-strong)}
.switch{width:52px;height:32px;border:0;border-radius:16px;background:#9e9e9e;position:relative;flex-shrink:0;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:24px}
.check{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--accent);border-radius:12px;background:#fff;padding:12px;cursor:pointer;text-align:left;width:100%}
.check .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--text);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1.5px dashed #bdbdbd;border-radius:12px;padding:14px;font-size:14px;line-height:1.6;color:var(--text-strong);margin:0;font-family:inherit}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;text-decoration:none;color:var(--text)}
.bottomnav a span{padding:2px 14px;border-radius:999px;display:flex;position:relative}
.bottomnav .nb{position:absolute;top:-6px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger-text);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bottomnav a[aria-current="page"]{font-weight:700;color:var(--text-strong)}
.bottomnav a[aria-current="page"] span{background:var(--accent)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.actionbar.withnav{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:12px}
.main.hasAction{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom))}
.setbtn .dot{min-width:20px;height:20px;border-radius:10px;background:var(--danger-text);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.backbtn{padding-left:6px}
.actionbar .inner{max-width:640px;margin:0 auto;display:flex;gap:10px}
.actionbar .inner>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--text-strong);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
.toast.show{display:block}
.modalbg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;color:var(--text-strong)}
.pin{letter-spacing:.4em;text-align:center;font-size:24px;font-weight:700;max-width:260px}
table.x{width:100%;border-collapse:collapse;font-size:14px}
table.x th,table.x td{padding:8px 10px;border-top:1px solid #f0f0f0;text-align:left;white-space:nowrap}
table.x th{background:#f6f6f6;font-size:13px;color:var(--text-strong)}
table.fx{table-layout:fixed;font-size:13px}table.fx th,table.fx td{padding:8px 4px;white-space:normal;overflow-wrap:anywhere}table.fx th{font-size:12px;overflow-wrap:normal;word-break:keep-all;padding:8px 2px}table.fx th:first-child,table.fx td:first-child{width:30%;padding-left:8px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
@media (min-width:900px){
  .shell{flex-direction:row}
  .bottomnav{position:sticky;top:0;left:auto;right:auto;height:100vh;width:220px;flex-shrink:0;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);order:-1}
  .bottomnav a{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;min-height:46px;padding:0 6px;border-radius:10px}
  .bottomnav a span{padding:4px 8px}
  .bottomnav .brand{display:flex}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .main{max-width:960px;padding-bottom:40px}
  .main.noNav{padding-bottom:120px}
  .toast{bottom:110px}
  .actionbar{left:220px}
  .actionbar.withnav{bottom:0;padding-bottom:16px}
  .main.hasAction{padding-bottom:120px}
  .wide2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
}
.wide2{display:flex;flex-direction:column;gap:12px}
.bottomnav .deskonly{display:none}
@media (min-width:900px){.wide2{display:grid}.bottomnav .deskonly{display:flex}}
.setbtn{min-height:44px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text-strong);font-size:14px;font-weight:600}
.brand{display:none;align-items:center;gap:10px;padding:0 6px 16px;font-weight:700;color:var(--text-strong)}
.brand i{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.content{display:flex;flex-direction:column;flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<noscript>กรุณาเปิดใช้ JavaScript เพื่อใช้งานแอป</noscript>
<script>
(function () {
'use strict';

/* =========================================================
   Project Sales Tracker · Pilot (Phase A, no server)
   Data model is server-ready (Phase C): every record has a
   global UUID, empId, createdAt/updatedAt and a synced flag.
   Replace Store.* persistence to add server sync later.
   ========================================================= */

var APP_VERSION = '1.6.0';
var SCHEMA_VERSION = 1;
var DB_NAME = 'ps-tracker';

  var R2 = liveFollows().filter(function (f) { return inM(f.date); }).map(function (f) { var p = projById(f.projectId) || {}; return [f.id, f.projectId, p.code || '', f.empId, f.empName, f.branch, f.team, f.date, p.name || '', p.ptype || '', f.statusBefore, f.statusAfter, f.lostReason, f.note, f.nextDate, f.lat != null ? +f.lat.toFixed(6) : '', f.lng != null ? +f.lng.toFixed(6) : '', f.distance != null ? f.distance : '', localTs(f.createdAt), lagDays(f.date, f.createdAt, f.importFile), (f.updatedAt || '').slice(0, 19)]; });
  var H3 = ['Sale ID', 'Project ID', 'รหัสโครงการ', 'Emp ID', 'Staff Name', 'สาขา', 'ทีม', 'ชื่อโครงการ', 'Project Type', 'ประเภทการติดต่อ', 'เลขที่ใบสั่งขาย (SO.)', 'วันที่ SO', 'มูลค่า SO (Ex Vat)', 'DP (Ex Vat)', 'วันที่ จัดส่ง', 'สถานะ SO', 'วันที่บันทึกในระบบ', 'บันทึกย้อนหลัง (วัน)', 'วันที่แก้ไขล่าสุด'];

    var R4 = []; Store.months.filter(function (m) { return !m.deleted && m.closed && (!ym || m.month === ym); }).sort(function (a, b) { return a.month.localeCompare(b.month); }).forEach(function (m) { (m.items || []).forEach(function (i) { R4.push([m.month, m.empId, m.empName, m.branch, m.team, i.projectId, i.code, i.name, i.ptype, i.channel || '', i.province, i.contactRole, i.status, i.estimate || 0, i.closingDate, i.completion, (m.closedAt || '').slice(0, 19)]); }); });

/* ---------------- backup / restore ---------------- */
function makeBackup() {
  var pw = S.ui.bpass || '';
  if (pw.length < 8) { toast('รหัสผ่านไฟล์สำรองต้องมีอย่างน้อย 8 ตัวอักษร'); $('#bp').focus(); return; }
  toast('กำลังสำรองข้อมูล…');
  var ids = []; Store.projects.forEach(function (p) { (p.photos || []).forEach(function (x) { ids.push(x); }); });
  Promise.all(ids.map(function (id) { return Store.photoBytes(id).catch(function () { return null; }); })).then(function (ph) {
    var payload = { records: Store.all(), photos: ph.filter(Boolean).map(function (x) { return { id: x.id, mime: x.mime, b64: b64(x.bytes) }; }), state: { profile: P(), options: O(), settings: Store.state.settings, counter: Store.state.counter } };
    var salt = crypto.getRandomValues(new Uint8Array(16));
    return Cx.derive(pw, salt, KDF_ITER).then(function (k) { return Cx.encJSON(k, payload); }).then(function (e) {
      var file = { format: 'ps-tracker-backup', version: 1, appVersion: APP_VERSION, schema: SCHEMA_VERSION, createdAt: nowISO(), empId: P().empId, kdf: { salt: b64(salt), iter: KDF_ITER }, iv: b64(e.iv), ct: b64(e.ct) };
      download(new Blob([JSON.stringify(file)], { type: 'application/json' }), 'PS_backup_' + (P().empId || 'EMP').replace(/[^\w-]/g, '') + '_' + todayISO() + '.json');
      Store.state.lastBackup = nowISO(); return Store.saveState();
    });
  }).then(function () { toast('สำรองข้อมูลแล้ว เก็บไฟล์ไว้ใน OneDrive ของบริษัท'); S.ui.bpass = ''; rerender(); }).catch(function () { toast('สำรองข้อมูลไม่สำเร็จ'); });
}
function restoreBackup(file) {
  var pw = S.ui.bpass || '';
  if (pw.length < 8) { toast('ใส่รหัสผ่านไฟล์สำรองก่อนเลือกไฟล์'); return; }
  if (file.size > 300 * 1024 * 1024) { toast('ไฟล์ใหญ่เกินไป'); return; }
  file.text().then(function (txt) {
    var f = JSON.parse(txt);
    if (f.format !== 'ps-tracker-backup') throw new Error('format');
    return Cx.derive(pw, unb64(f.kdf.salt), f.kdf.iter).then(function (k) { return Cx.decJSON(k, unb64(f.iv), unb64(f.ct)); });
  }).then(function (data) {
    var bid = data && ((data.state && data.state.profile && data.state.profile.empId) || (data.profile && data.profile.empId) || ((data.records || []).filter(function (r) { return r && r.empId; })[0] || {}).empId);
    if (!bid || normEmp(bid) === normEmp(P().empId)) return data;
    var other = empTaken(bid, S.user && S.user.id);
    if (other) { toast('ไฟล์นี้เป็นของ Emp ID ' + bid + ' (' + (other.label || '') + ') ซึ่งมีบัญชีในเครื่องนี้แล้ว ให้กู้คืนในบัญชีของคนนั้น'); throw 'skip'; }
    return confirmBox('ไฟล์สำรองเป็นของคนอื่น', 'ไฟล์นี้เป็นของ Emp ID ' + bid + ' แต่ผู้ใช้ปัจจุบันคือ ' + P().empId + ' ถ้ากู้คืน ข้อมูลจะรวมเข้ากับบัญชีนี้ ควรเพิ่มผู้ใช้ใหม่ในเครื่อง แล้วกู้คืนในบัญชีนั้นแทน ต้องการกู้คืนเข้าบัญชีนี้หรือไม่', 'กู้คืนเข้าบัญชีนี้').then(function (ok) { if (!ok) throw 'skip'; return data; });
  }).then(function (data) {
    var added = 0, jobs = [];
    (data.photos || []).forEach(function (ph) { jobs.push(DB.get('photos', ph.id).then(function (ex) { if (ex) return; var bytes = unb64(ph.b64); return Cx.enc(Cx.key, bytes).then(function (e) { return DB.put('photos', { id: ph.id, mime: ph.mime, iv: e.iv, ct: e.ct }); }); })); });
    return Promise.all(jobs).then(function () {
      var seq = Promise.resolve();
      (data.records || []).forEach(function (r) {
        if (!r || !r.id || ['project', 'follow', 'sale', 'month'].indexOf(r.kind) < 0) return;
        var cur = Store.list(r.kind).find(function (x) { return x.id === r.id; });
        if (!cur || (r.updatedAt || '') > (cur.updatedAt || '')) { added++; seq = seq.then(function () { return Store.save(r, true); }); }
      });
      return seq;
    }).then(function () {
      var st = Store.state, b = data.state || {};
      if (O().version === 'default' && b.options) st.options = migrateState({ options: b.options }).options;
      if (b.settings && b.settings.targets) Object.keys(b.settings.targets).forEach(function (m) { if (st.settings.targets[m] == null) st.settings.targets[m] = b.settings.targets[m]; });
      st.counter = Math.max(st.counter || 0, b.counter || 0);
      return Store.saveState();
    }).then(migrateRecords).then(function () { toast('กู้คืนแล้ว ' + added + ' รายการ'); S.ui.bpass = ''; rerender(); });
  }).catch(function (e) { if (e === 'skip') return; toast('กู้คืนไม่สำเร็จ รหัสผ่านไม่ถูกต้องหรือไฟล์ไม่ถูกต้อง'); });
}
function wipeAll() { Cx.key = null; Store.reset(); var u = S.user; (u ? DIR.del(u.id) : Promise.resolve()).catch(function () { }).then(function () { return DB.destroy(); }).then(function () { location.hash = ''; location.reload(); }); }

/* ---------------- auth ---------------- */
function onboard() {
  var d = S.draft, e = {}, p1 = $('#o-p1').value, p2 = $('#o-p2').value;
  if (!clean(d.empId)) e.empId = 'กรุณาใส่ Emp ID'; else if (empTaken(d.empId)) e.empId = 'Emp ID นี้มีผู้ใช้ในเครื่องนี้แล้ว ให้กลับไปเลือกชื่อของตัวเองแล้วใส่ PIN'; if (!clean(d.name)) e.name = 'กรุณาใส่ชื่อ'; if (!clean(d.branch)) e.branch = 'กรุณาใส่สาขา';
  if (!/^\d{6}$/.test(p1)) e.pin = 'PIN ต้องเป็นตัวเลข 6 หลัก'; else if (p1 !== p2) e.pin = 'PIN ทั้งสองช่องไม่ตรงกัน'; else if (/^(\d)\1{5}$/.test(p1) || p1 === '123456' || p1 === '654321') e.pin = 'PIN นี้เดาง่ายเกินไป';
  S.ui.errors = e; if (Object.keys(e).length) { S.ui.focusErr = true; app.innerHTML = vOnboard(); return; }
  var btn = $('[data-act="onboard"]'); btn.disabled = true; btn.textContent = 'กำลังตั้งค่า…';
  var salt = crypto.getRandomValues(new Uint8Array(16)), nu = { id: uid(), empId: clean(d.empId, 20), label: firstName(d.name), createdAt: nowISO() };
  nu.db = 'ps-tracker-' + nu.id;
  DB_NAME = nu.db;
  DB.open().then(function () { return Cx.derive(p1, salt, KDF_ITER); }).then(function (k) {
    Cx.key = k;
    return Cx.encJSON(k, { ok: 'ps-tracker' }).then(function (v) { return DB.put('meta', { salt: salt, iter: KDF_ITER, iv: v.iv, ct: v.ct, createdAt: nowISO() }, 'auth'); });
  }).then(function () {
    Store.state = migrateState({ profile: { empId: clean(d.empId, 20), name: clean(d.name, 80), branch: clean(d.branch, 60), team: clean(d.team, 60) } });
    return Store.saveState();
  }).then(function () {
    return DIR.put(nu);
  }).then(function () {
    S.users = (S.users || []).concat([nu]); S.user = nu; S.newUser = false;
    S.hasAuth = true; S.draft = null; S.ui = {};
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    location.hash = '#/today'; render(); toast('ตั้งค่าเรียบร้อย เริ่มใช้งานได้เลย');
  }).catch(function () { toast('ตั้งค่าไม่สำเร็จ'); btn.disabled = false; btn.textContent = 'เริ่มใช้งาน'; });
}
function tryUnlock() {
  if (S.lockUntil > Date.now()) return;
  var pin = $('#pin').value, msg = $('#lockmsg'), btn = $('[data-act="unlock"]');
  if (!/^\d{6}$/.test(pin)) { msg.textContent = 'PIN ต้องเป็นตัวเลข 6 หลัก'; return; }
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
  DB.get('meta', 'auth').then(function (a) {
    return Cx.derive(pin, a.salt, a.iter).then(function (k) { return Cx.decJSON(k, a.iv, a.ct).then(function () { return k; }); });
  }).then(function (k) {
    Cx.key = k; S.failed = 0; return Store.load();
  }).then(syncUserEntry).then(function () { touch(); S.route = ''; if (!location.hash || location.hash === '#') location.hash = '#/today'; render(); }).catch(function () {
    Cx.key = null; Store.reset(); S.failed++;
    if (S.failed >= 5) { S.lockUntil = Date.now() + 30000; S.failed = 0; setTimeout(render, 30500); }
    render(); var m = $('#lockmsg'); if (m && S.lockUntil <= Date.now()) m.textContent = 'PIN ไม่ถูกต้อง';
  });
}
function lockApp() { Cx.key = null; Store.reset(); S.draft = null; S.ui = {}; S.route = ''; render(); }
function changePin(a, b) {
  if (!/^\d{6}$/.test(a)) { toast('PIN ต้องเป็นตัวเลข 6 หลัก'); return; }
  if (a !== b) { toast('PIN ทั้งสองช่องไม่ตรงกัน'); return; }
  toast('กำลังเปลี่ยน PIN…');
  var salt = crypto.getRandomValues(new Uint8Array(16)), oldKey = Cx.key, newKey;
  Cx.derive(a, salt, KDF_ITER).then(function (k) {
    newKey = k;
    return DB.all('photos').then(function (ps) { return Promise.all(ps.map(function (p) { return Cx.dec(oldKey, p.iv, p.ct).then(function (b) { return Cx.enc(newKey, b); }).then(function (e) { p.iv = e.iv; p.ct = e.ct; return p; }); })); });
  }).then(function (photos) {
    Cx.key = newKey;
    var all = Store.all();
    return Promise.all(all.map(function (r) { return Cx.encJSON(newKey, r).then(function (e) { return { id: r.id, kind: r.kind, iv: e.iv, ct: e.ct }; }); })).then(function (recs) {
      return Promise.all([Cx.encJSON(newKey, { ok: 'ps-tracker' }), Cx.encJSON(newKey, Store.state)]).then(function (v) {
        return new Promise(function (res, rej) {
          var t = DB.db.transaction(['meta', 'records', 'photos'], 'readwrite');
          recs.forEach(function (r) { t.objectStore('records').put(r); });
          photos.forEach(function (p) { t.objectStore('photos').put(p); });
          t.objectStore('meta').put({ salt: salt, iter: KDF_ITER, iv: v[0].iv, ct: v[0].ct, createdAt: nowISO() }, 'auth');
          t.objectStore('meta').put({ iv: v[1].iv, ct: v[1].ct }, 'vault');
          t.oncomplete = res; t.onerror = function () { rej(t.error); }; t.onabort = function () { rej(t.error); };
        });
      });
    });
  }).then(function () { toast('เปลี่ยน PIN แล้ว'); rerender(); }).catch(function () { Cx.key = oldKey; toast('เปลี่ยน PIN ไม่สำเร็จ ใช้ PIN เดิมต่อได้'); });
}

/* ---------------- auto-lock ---------------- */
setInterval(function () { if (Cx.key && Date.now() - S.lastActive > (Store.state ? Store.state.settings.autolock : 5) * 60000) lockApp(); }, 15000);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) S.hiddenAt = Date.now();
  else if (Cx.key && S.hiddenAt && Date.now() - S.hiddenAt > (Store.state ? Store.state.settings.autolock : 5) * 60000) lockApp();
});

/* ---------------- boot ---------------- */
if (!window.crypto || !crypto.subtle || !window.indexedDB) {
  app.innerHTML = '<div class="lock"><h1>เบราว์เซอร์นี้ไม่รองรับ</h1><p>กรุณาเปิดผ่าน Safari หรือ Chrome รุ่นล่าสุด และเปิดผ่านลิงก์ https เท่านั้น</p></div>';
  return;
}
DIR.open().then(function () { return DIR.all(); }).then(function (users) {
  S.users = users || [];
  if (S.users.length) return;
  DB_NAME = 'ps-tracker';
  return DB.open().then(function () { return DB.get('meta', 'auth'); }).then(function (a) {
    if (!a) return;
    var legacy = { id: 'u0', db: 'ps-tracker', empId: '', label: 'ผู้ใช้เดิม', createdAt: nowISO() };
    return DIR.put(legacy).then(function () { S.users = [legacy]; });
  });
}).then(function () {
  if (S.users.length === 1) return selectUser(S.users[0]);
  render();
}).catch(function () {
  app.innerHTML = '<div class="lock"><h1>เปิดฐานข้อมูลไม่ได้</h1><p>หากใช้โหมดไม่ระบุตัวตน (Private) ให้ปิดโหมดนั้นก่อน หรือปิดแท็บอื่นของแอปนี้แล้วลองใหม่</p></div>';
});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); }).catch(function () { });
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController) { S.updateReady = true; if (Cx.key) rerender(); } });
}

window.__PST = { version: APP_VERSION };
})();
